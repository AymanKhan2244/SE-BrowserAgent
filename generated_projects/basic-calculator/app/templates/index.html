<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basic Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="calculator-container">
        <h1>Basic Calculator</h1>
        <form id="calc-form" autocomplete="off">
            <div class="input-group">
                <label for="operand1">Operand 1</label>
                <input type="number" step="any" id="operand1" name="operand1" required>
            </div>
            <div class="input-group">
                <label for="operation">Operation</label>
                <select id="operation" name="operation" required>
                    <option value="+">+</option>
                    <option value="-">−</option>
                    <option value="*">×</option>
                    <option value="/">÷</option>
                </select>
            </div>
            <div class="input-group">
                <label for="operand2">Operand 2</label>
                <input type="number" step="any" id="operand2" name="operand2" required>
            </div>
            <button type="submit" id="calculateBtn">Calculate</button>
        </form>
        <div id="result" class="result"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
