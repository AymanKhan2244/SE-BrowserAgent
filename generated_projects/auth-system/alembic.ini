[alembic]
# Path to migration scripts
script_location = alembic
# File template for new migration scripts
file_template = %%(rev)s_%%(slug)s

# Whether to run migrations in "offline" mode (generates SQL scripts)
# Set to true if you want to generate SQL without a live DB connection.
# offline_mode = False

# Logging configuration
# The default logging config prints to stdout. Adjust as needed.
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html#logging
# for more details.
# -------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
propagate = 0

[logger_alembic]
level = INFO
handlers =
qualname = alembic
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S

# -------------------------------------------------
[alembic:environment]
# The database URL. It can be a literal URL or an environment variable.
# Example: postgresql+psycopg2://user:password@localhost/auth_db
sqlalchemy.url = ${DATABASE_URL}

# -------------------------------------------------
[alembic:ini_section]
# Additional custom options can be placed here.
# For example, you might want to set the timezone for timestamps:
# timezone = UTC
```