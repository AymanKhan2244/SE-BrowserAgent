# ForgeAI Nginx Reverse Proxy Configuration
# 
# This configuration proxies incoming traffic to the FastAPI server running on port 8000.
# It includes the necessary headers to support Server-Sent Events (SSE) and WebSockets, 
# which are required for the real-time agent logs and generated app previews.

server {
    listen 80;
    server_name localhost; # Replace with your domain or IP in production

    # Maximum upload size for projects
    client_max_body_size 50M;

    # Proxy all requests to the FastAPI backend
    location / {
        proxy_pass http://127.0.0.1:8000;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Required for previewing generated apps that use WebSockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout settings (Pipeline generation might take a while)
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Specifically handle the SSE stream endpoint to prevent buffering
    location /api/forge/stream {
        proxy_pass http://127.0.0.1:8000/api/forge/stream;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Disable buffering to allow real-time streaming of agent logs
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Keep the connection open for long-running pipelines
        proxy_read_timeout 12h;
    }
}
