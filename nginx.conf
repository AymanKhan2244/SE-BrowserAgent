# ForgeAI Nginx Reverse Proxy Configuration - Highly Scalable (Targeting 1M Users)

# 1. GLOBAL TUNING
# Use all available CPU cores
worker_processes auto;

# Increase limit of open files per worker (needs OS level sysctl/limits tuning too)
# Without this, Nginx will throw "too many open files" errors under load.
worker_rlimit_nofile 200000;

events {
    # Number of connections per worker process. (worker_processes * worker_connections = max clients)
    # E.g., 16 cores * 65535 = ~1M concurrent connections
    worker_connections 65535;
    
    # Accept as many connections as possible simultaneously
    multi_accept on;
    
    # Optimal event model for Linux
    use epoll;
}

http {
    # 2. CORE HTTP TUNING
    include       mime.types;
    default_type  application/octet-stream;

    # Optimize disk IO and network transmission
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Decrease timeouts to drop slow/dead clients and free up resources faster
    keepalive_timeout 65;
    keepalive_requests 100000;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    
    # Hide Nginx version for slight security boost
    server_tokens off;

    # 3. BUFFER TUNING
    # Prevent Nginx from writing temporary files to disk by allocating enough memory
    client_body_buffer_size 128k;
    client_max_body_size 50M; # Keeps the 50M upload size you had
    client_header_buffer_size 3m;
    large_client_header_buffers 4 256k;

    # 4. COMPRESSION
    # Reduces bandwidth significantly, allowing Nginx to serve more users
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6; # 6 is a good balance between compression and CPU usage
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # (Optional but recommended) Buffer logs to reduce disk I/O bottlenecks
    # access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    # error_log /var/log/nginx/error.log warn;

    # 5. LOAD BALANCING TUNING
    upstream fastapi_backend {
        # least_conn distributes load to the server with the fewest active connections,
        # much better than round-robin for APIs with varying request lengths.
        least_conn;
        
        # max_fails and fail_timeout ensure Nginx stops sending traffic to a dead backend
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
        
        # Maintain keepalive connections to backends to reduce connection setup overhead
        keepalive 100;
    }

    server {
        # backlog=65535 allows the OS to queue up to 65535 connections when Nginx is too busy
        listen 80 backlog=65535; 
        server_name localhost;
        
        # Basic Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # 6. ROUTING
        location / {
            proxy_pass http://fastapi_backend;
            
            # Crucial: Use HTTP 1.1 and clear Connection header to use keepalives with the upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            # (Note: Connection "upgrade" here overrides the keepalive Connection "" above for WS requests)

            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # SSE stream endpoint
        location /api/forge/stream {
            proxy_pass http://fastapi_backend/api/forge/stream;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Disable buffering for real-time streaming
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Keep the connection open for long-running pipelines
            proxy_read_timeout 12h;
        }
    }
}
